# ============================================================================
# CI/CD Pipeline for FREDDY - Personal & Authentication Services Server
# ============================================================================
# Personal home server running photos, cloud storage, home automation
# Repository: nuniesmith/freddy
#
# Services: nginx, photoprism, nextcloud, homeassistant, audiobookshelf, authentik, uptime-kuma
#
# Features:
#   - Deployment via Tailscale + SSH
#   - Git pull / clone + Docker Compose rebuild & restart
# ============================================================================
name: 🏠 Freddy Deploy

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".gitignore"
      # Changing the per-service updater is not a reason to stop and recreate
      # every container in the house. Merging it did exactly that once.
      - ".github/workflows/update-service.yml"
      - ".github/workflows/daily-update.yml"
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_deploy:
        description: "Skip deployment (test workflow only)"
        required: false
        type: boolean
        default: false
      reset_nextcloud_db:
        description: "Full Nextcloud reset: clears database, config, and app files (preserves user data)"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

env:
  SERVER_NAME: freddy
  PROJECT_PATH: freddy
  DOMAIN: 7gram.xyz

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  # ==========================================================================
  # DEPLOYMENT
  # ==========================================================================
  deploy:
    name: 🚀 Deploy to Freddy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: |
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' && inputs.skip_deploy != true
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      # ======================================================================
      # TAILSCALE CONNECTION
      # ======================================================================
      - name: 🔌 Connect to Tailscale
        id: tailscale
        uses: nuniesmith/actions/.github/actions/tailscale-connect@main
        with:
          oauth-client-id: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TAILSCALE_OAUTH_SECRET }}
          target-ip: ${{ secrets.FREDDY_TAILSCALE_IP }}
          target-ssh-port: ${{ secrets.SSH_PORT || '22' }}

      # ======================================================================
      # DEPLOY VIA SSH
      # ======================================================================
      - name: 🚀 Deploy via SSH
        id: deploy
        if: steps.tailscale.outputs.connected == 'true'
        uses: nuniesmith/actions/.github/actions/ssh-deploy@main
        with:
          host: ${{ secrets.FREDDY_TAILSCALE_IP }}
          port: ${{ secrets.SSH_PORT || '22' }}
          username: ${{ secrets.SSH_USER || 'actions' }}
          ssh-key: ${{ secrets.SSH_KEY }}
          project-path: ${{ env.PROJECT_PATH }}
          git-pull: false
          git-branch: ${{ github.ref_name }}
          docker-prune: false
          pre-deploy-command: |
            echo "🏠 Deploying to Freddy server..."

            # Create project directory if it doesn't exist
            echo "📁 Ensuring project directory exists..."
            mkdir -p $HOME/${{ env.PROJECT_PATH }}
            cd $HOME/${{ env.PROJECT_PATH }}

            # Handle git repository setup
            if [ -d .git ] && git status >/dev/null 2>&1; then
              echo "📥 Updating existing repository..."
              git fetch origin
              git checkout ${{ github.ref_name }}
              git pull origin ${{ github.ref_name }} || {
                echo "⚠️ Git pull failed, doing hard reset..."
                git reset --hard origin/${{ github.ref_name }}
              }
            else
              echo "📥 Cloning repository (first deployment)..."
              cd ~
              rm -rf $HOME/${{ env.PROJECT_PATH }}
              git clone https://github.com/${{ github.repository }}.git $HOME/${{ env.PROJECT_PATH }}
              cd $HOME/${{ env.PROJECT_PATH }}
              git checkout ${{ github.ref_name }}
            fi

            # Ensure run.sh is executable
            chmod +x ./run.sh 2>/dev/null || true

            echo "🔐 Setting up .env file..."
            # Try run.sh first (primary method)
            ENV_CREATED=false
            if [ -f ./run.sh ]; then
              echo "   ▶ Running: bash ./run.sh setup-env"
              bash ./run.sh setup-env 2>&1 || true
              if [ -f .env ] && [ -s .env ]; then
                echo "   ✅ .env exists after run.sh ($(wc -l < .env) lines)"
                ENV_CREATED=true
              fi
            fi

            # Fallback: create .env directly
            if [ "$ENV_CREATED" != "true" ]; then
              echo "   🔄 Fallback: Creating .env directly..."
              GEN_PASS() { openssl rand -base64 24 2>/dev/null | tr -d '/+=' | head -c 16 || cat /dev/urandom | tr -dc 'a-zA-Z0-9' | fold -w 16 | head -n 1; }
              GEN_SECRET() { openssl rand -hex 16 2>/dev/null || cat /dev/urandom | tr -dc 'a-zA-Z0-9' | fold -w 32 | head -n 1; }
              cat > .env << 'ENVEOF'
            # Freddy Home Server - Auto-generated by CI/CD fallback
            ENVEOF
              # Generate with variable expansion
              cat >> .env << ENVEOF
            TZ=${{ secrets.TZ || 'America/Toronto' }}
            PUID=${{ secrets.PUID || '1000' }}
            PGID=${{ secrets.PGID || '1000' }}
            PHOTOPRISM_ADMIN_PASSWORD=$(GEN_PASS)
            PHOTOPRISM_DB_NAME=photoprism
            PHOTOPRISM_DB_USER=photoprism
            PHOTOPRISM_DB_PASSWORD=$(GEN_PASS)
            NEXTCLOUD_DB_NAME=nextcloud
            NEXTCLOUD_DB_USER=nextcloud
            NEXTCLOUD_DB_PASSWORD=$(GEN_PASS)
            NEXTCLOUD_ADMIN_USER=admin
            NEXTCLOUD_ADMIN_PASSWORD=$(GEN_PASS)
            AUTHENTIK_SECRET_KEY=$(GEN_SECRET)
            AUTHENTIK_POSTGRES_USER=authentik
            AUTHENTIK_POSTGRES_PASSWORD=$(GEN_PASS)
            SULLIVAN_TAILSCALE_IP=${{ secrets.SULLIVAN_TAILSCALE_IP || '100.87.125.19' }}
            MEDIA_PATH_AUDIOBOOKS=${{ secrets.MEDIA_PATH_AUDIOBOOKS || '/media/audiobooks' }}
            SHELFMARK_API_TOKEN=
            AUDIOBOOKSHELF_API_TOKEN=
            AUDIOBOOKSHELF_LIBRARY_ID=
            PROWLARR_URL=
            PROWLARR_API_KEY=
            QBITTORRENT_URL=
            QBITTORRENT_USERNAME=
            QBITTORRENT_PASSWORD=
            DISCORD_BOT_TOKEN=
            SHELFMARK_DISCORD_GUILD_ID=
            SHELFMARK_DISCORD_ALLOWED_ROLE_IDS=
            AUTHENTIK_SECRET_KEY=$(GEN_SECRET)$(GEN_SECRET)
            AUTHENTIK_POSTGRES_USER=authentik
            AUTHENTIK_POSTGRES_PASSWORD=$(GEN_PASS)
            ENVEOF
              sed -i 's/^            //' .env
              echo "   ✅ Fallback .env created ($(wc -l < .env) lines)"
            fi

            # Verify critical keys
            MISSING_KEYS=0
            MISSING_NAMES=""
            for key in TZ PHOTOPRISM_ADMIN_PASSWORD NEXTCLOUD_ADMIN_PASSWORD AUTHENTIK_SECRET_KEY AUTHENTIK_POSTGRES_PASSWORD; do
              if ! grep -q "^${key}=" .env 2>/dev/null; then
                MISSING_KEYS=$((MISSING_KEYS + 1))
                MISSING_NAMES="$MISSING_NAMES $key"
              fi
            done
            if [ "$MISSING_KEYS" -gt 2 ]; then
              echo "   ❌ Too many critical keys missing ($MISSING_KEYS):$MISSING_NAMES"
              exit 1
            fi
            echo "   ✅ .env verification passed ($(grep -c '^[A-Z_]' .env 2>/dev/null || echo '?') keys)"

            # Inject secrets from GitHub Actions (if provided)
            echo "🔐 Injecting secrets from GitHub Actions..."
            if [ -n "${{ secrets.PHOTOPRISM_ADMIN_PASSWORD }}" ]; then
              sed -i "s/^PHOTOPRISM_ADMIN_PASSWORD=.*/PHOTOPRISM_ADMIN_PASSWORD=${{ secrets.PHOTOPRISM_ADMIN_PASSWORD }}/" .env
            fi
            if [ -n "${{ secrets.PHOTOPRISM_DB_PASSWORD }}" ]; then
              sed -i "s/^PHOTOPRISM_DB_PASSWORD=.*/PHOTOPRISM_DB_PASSWORD=${{ secrets.PHOTOPRISM_DB_PASSWORD }}/" .env
            fi
            if [ -n "${{ secrets.NEXTCLOUD_DB_PASSWORD }}" ]; then
              sed -i "s/^NEXTCLOUD_DB_PASSWORD=.*/NEXTCLOUD_DB_PASSWORD=${{ secrets.NEXTCLOUD_DB_PASSWORD }}/" .env
            fi
            if [ -n "${{ secrets.NEXTCLOUD_ADMIN_USER }}" ]; then
              sed -i "s/^NEXTCLOUD_ADMIN_USER=.*/NEXTCLOUD_ADMIN_USER=${{ secrets.NEXTCLOUD_ADMIN_USER }}/" .env
            fi
            if [ -n "${{ secrets.NEXTCLOUD_ADMIN_PASSWORD }}" ]; then
              sed -i "s/^NEXTCLOUD_ADMIN_PASSWORD=.*/NEXTCLOUD_ADMIN_PASSWORD=${{ secrets.NEXTCLOUD_ADMIN_PASSWORD }}/" .env
            fi
            if [ -n "${{ secrets.AUTHENTIK_SECRET_KEY }}" ]; then
              sed -i "s/^AUTHENTIK_SECRET_KEY=.*/AUTHENTIK_SECRET_KEY=${{ secrets.AUTHENTIK_SECRET_KEY }}/" .env
            fi
            if [ -n "${{ secrets.AUTHENTIK_POSTGRES_PASSWORD }}" ]; then
              sed -i "s/^AUTHENTIK_POSTGRES_PASSWORD=.*/AUTHENTIK_POSTGRES_PASSWORD=${{ secrets.AUTHENTIK_POSTGRES_PASSWORD }}/" .env
            fi

            # Shelfmark. Every one of these is optional: the API and worker
            # start with them blank, and a wrong value returns a 502 from the
            # affected route rather than taking the service down. A missing
            # secret is a degraded feature, never a failed deploy — add it and
            # the next deploy picks it up.
            #
            # Rewrite-by-filter rather than `sed -i s/^KEY=.*/`: sed only
            # substitutes when the line already exists, and it reads a / in the
            # value as its delimiter. Tokens contain slashes.
            upsert_env() {
              key="$1"; value="$2"
              [ -z "$value" ] && return 0
              grep -v "^${key}=" .env > .env.tmp 2>/dev/null || true
              printf '%s=%s\n' "$key" "$value" >> .env.tmp
              mv .env.tmp .env
              echo "  ✓ ${key} configured"
            }

            upsert_env SHELFMARK_API_TOKEN "${{ secrets.SHELFMARK_API_TOKEN }}"
            upsert_env AUDIOBOOKSHELF_API_TOKEN "${{ secrets.AUDIOBOOKSHELF_API_TOKEN }}"
            upsert_env AUDIOBOOKSHELF_LIBRARY_ID "${{ secrets.AUDIOBOOKSHELF_LIBRARY_ID }}"
            upsert_env PROWLARR_URL "${{ secrets.PROWLARR_URL }}"
            upsert_env PROWLARR_API_KEY "${{ secrets.PROWLARR_API_KEY }}"
            upsert_env QBITTORRENT_URL "${{ secrets.QBITTORRENT_URL }}"
            upsert_env QBITTORRENT_USERNAME "${{ secrets.QBITTORRENT_USERNAME }}"
            upsert_env QBITTORRENT_PASSWORD "${{ secrets.QBITTORRENT_PASSWORD }}"
            upsert_env DISCORD_BOT_TOKEN "${{ secrets.DISCORD_BOT_TOKEN }}"
            upsert_env SHELFMARK_DISCORD_GUILD_ID "${{ secrets.SHELFMARK_DISCORD_GUILD_ID }}"
            upsert_env SHELFMARK_DISCORD_ALLOWED_ROLE_IDS "${{ secrets.SHELFMARK_DISCORD_ALLOWED_ROLE_IDS }}"
            # The WORKER posts pipeline results here, not the bot — a download
            # that finishes long after the Discord interaction expired has no
            # interaction left to reply to. Without this the whole unattended
            # pipeline reports success and failure into a job row nobody reads.
            upsert_env SHELFMARK_DISCORD_WEBHOOK_URL "${{ secrets.SHELFMARK_DISCORD_WEBHOOK_URL }}"

            # `shelfmark-bot` is the only service behind a Compose profile
            # (`discord`), and `docker compose up -d` SKIPS profiled services
            # in silence — no error, no container, nothing in the deploy log to
            # notice. Setting the token and getting no bot, with no failure
            # anywhere to explain it, is the obvious trap here.
            #
            # Compose reads COMPOSE_PROFILES from this same .env, so tying it
            # to the token means setting the secret is all that is needed.
            if [ -n "${{ secrets.DISCORD_BOT_TOKEN }}" ]; then
              upsert_env COMPOSE_PROFILES "discord"
              echo "  ✓ discord profile active — shelfmark-bot will start"
            else
              # Drop the key rather than writing an empty one: an empty
              # COMPOSE_PROFILES is a valid "no profiles" setting, but leaving
              # a stale "discord" behind would start a bot with no token.
              grep -v "^COMPOSE_PROFILES=" .env > .env.tmp 2>/dev/null || true
              mv .env.tmp .env
              echo "  · discord profile inactive — no DISCORD_BOT_TOKEN set"
            fi

            # Private key for the restricted shelfmark-sync account on sullivan.
            # Written here rather than by hand because ssh refuses a private key
            # that is group- or world-readable, and this step runs as the same
            # user the containers do (actions, uid 1001) — so the file lands
            # owned by the right uid at mode 600 without a chown.
            if [ -n "${{ secrets.SHELFMARK_SULLIVAN_SSH_KEY }}" ]; then
              mkdir -p /mnt/1tb/shelfmark/ssh
              chmod 700 /mnt/1tb/shelfmark/ssh
              printf '%s\n' "${{ secrets.SHELFMARK_SULLIVAN_SSH_KEY }}" > /mnt/1tb/shelfmark/ssh/id_ed25519
              chmod 600 /mnt/1tb/shelfmark/ssh/id_ed25519
              echo "  ✓ sullivan sync key installed"
            else
              # The bind mount needs its directory to exist even when empty, or
              # Compose creates it as root and the containers cannot read it.
              mkdir -p /mnt/1tb/shelfmark/ssh
              chmod 700 /mnt/1tb/shelfmark/ssh
              echo "  · sullivan sync key not set — transfers stay unconfigured"
            fi

            echo "   ✅ Secrets injected"
            chmod 600 .env

            echo ""

            # Ensure all bind-mount directories for Docker volumes exist
            echo "📁 Ensuring volume mount directories exist..."
            docker run --rm -v /mnt/1tb:/mnt busybox sh -c "\
              mkdir -p \
                /mnt/photos \
                /mnt/photoprism/storage \
                /mnt/photoprism/postgres \
                /mnt/nextcloud/html \
                /mnt/nextcloud/config \
                /mnt/nextcloud/data \
                /mnt/nextcloud/postgres \
                /mnt/homeassistant \
                /mnt/audiobookshelf/audiobooks \
                /mnt/audiobookshelf/config \
                /mnt/audiobookshelf/metadata \
                /mnt/authentik/postgres \
                /mnt/authentik/redis \
                /mnt/authentik/media \
                /mnt/authentik/templates \
                /mnt/uptime-kuma \
              && chown -R 33:33 /mnt/nextcloud/html /mnt/nextcloud/config /mnt/nextcloud/data \
              && echo '  ✅ Volume directories ready'"

            # Full Nextcloud reset if requested
            if [ "${{ inputs.reset_nextcloud_db }}" = "true" ]; then
              echo "🔄 Performing full Nextcloud reset..."
              echo "   ⚠️  This will DELETE database, config, and app files!"
              echo "   ℹ️  User data in /mnt/1tb/nextcloud/data is preserved."
              docker stop nextcloud nextcloud-cron nextcloud-postgres 2>/dev/null || true
              docker rm nextcloud nextcloud-cron nextcloud-postgres 2>/dev/null || true
              docker run --rm -v /mnt/1tb:/mnt busybox sh -c "\
                echo '  → Removing PostgreSQL data...' \
                && rm -rf /mnt/nextcloud/postgres/* \
                && echo '  → Removing stale config (config.php)...' \
                && rm -rf /mnt/nextcloud/config/* \
                && echo '  → Removing app files (will be re-extracted from image)...' \
                && rm -rf /mnt/nextcloud/html/* \
                && echo '  → Re-creating directories with correct ownership...' \
                && mkdir -p /mnt/nextcloud/html /mnt/nextcloud/config /mnt/nextcloud/data /mnt/nextcloud/postgres \
                && chown -R 33:33 /mnt/nextcloud/html /mnt/nextcloud/config /mnt/nextcloud/data \
                && echo '  ✅ Nextcloud full reset complete (will reinitialize on next start)'"
            fi

            # Every image must be in hand BEFORE anything stops. On 2026-09-25 a
            # single `denied` from ghcr.io (a stale registry login another deploy
            # had left in this account) aborted `up --pull always` AFTER the stack
            # was already down, and freddy sat empty for 17 minutes while this
            # workflow printed success. Pulling here fails the deploy with the
            # house still running.
            echo "📥 Pulling every image before stopping anything..."
            if ! ( cd "$HOME/${{ env.PROJECT_PATH }}" && docker compose pull --quiet ); then
              echo "❌ Image pull failed -- the running stack was left untouched"
              exit 1
            fi
            echo "✅ All images pulled"

            # Stop existing services to release file locks
            echo "🛑 Stopping existing services..."
            if [ -d "$HOME/${{ env.PROJECT_PATH }}" ]; then
              cd $HOME/${{ env.PROJECT_PATH }}
              ./run.sh stop 2>/dev/null || docker compose down 2>/dev/null || true
              cd ~
            fi

            # Load environment variables
            if [ -f .env ]; then
              set -a && source .env && set +a
              echo "✓ Environment loaded"
            fi

          deploy-command: |
            # Without -e a failed `up` fell through to "✅ Deployment complete",
            # which is how an empty host reported success.
            set -euo pipefail

            # Action already cd's to PROJECT_PATH; use absolute path as safeguard
            cd $HOME/${{ env.PROJECT_PATH }}

            # Stop and remove existing containers + networks
            echo "🐳 Stopping existing services..."
            docker compose down --remove-orphans 2>/dev/null || true

            # Remove stale audiobookshelf volumes (created with bad paths before fix).
            # These are bind-backed (/mnt/1tb/...): removing the definition leaves
            # the library, config and metadata on disk, and `up` recreates it.
            echo "🧹 Removing stale audiobookshelf volumes (if any)..."
            docker volume rm freddy_audiobookshelf_data freddy_audiobookshelf_config freddy_audiobookshelf_metadata 2>/dev/null || true

            # No nginx build: freddy runs no nginx (princess is the only proxy),
            # so `docker compose build nginx` failed on every deploy -- silently,
            # until -e above would have made it fail the deploy.

            # Images were pulled before anything stopped, so this does not touch
            # the registry: a registry hiccup can no longer strand an empty host.
            echo "🚀 Starting all services..."
            docker compose up -d --force-recreate --remove-orphans

            echo "✅ Deployment complete"

          post-deploy-command: |
            cd $HOME/${{ env.PROJECT_PATH }}
            echo ""
            echo "📊 Service Status:"
            docker compose ps --format "table {{.Name}}\t{{.Status}}\t{{.Ports}}" 2>/dev/null || docker ps --format "table {{.Names}}\t{{.Status}}"
            echo ""
            echo "✅ Deployment complete!"

      # ======================================================================
      # HEALTH CHECKS
      # ======================================================================
      - name: 🏥 Run Health Checks
        id: health-checks
        if: always() && steps.deploy.outcome == 'success'
        uses: nuniesmith/actions/.github/actions/health-check@main
        with:
          # Every name here must be a container that actually exists AND
          # declares a healthcheck, or the gate can never pass. This list had
          # drifted to include `nginx` (freddy runs none -- princess is the
          # only proxy) and `authentik-server` (removed), so it reported 5/7
          # on a completely healthy stack and, with fail-on-unhealthy now
          # true, blocked every deploy.
          containers: photoprism nextcloud nextcloud-postgres homeassistant audiobookshelf shelfmark-api shelfmark-worker uptime-kuma
          ssh-host: ${{ secrets.FREDDY_TAILSCALE_IP }}
          ssh-port: ${{ secrets.SSH_PORT || '22' }}
          ssh-user: ${{ secrets.SSH_USER || 'actions' }}
          ssh-key: ${{ secrets.SSH_KEY }}
          initial-delay: 30
          retry-count: 3
          retry-delay: 10
          # Assert the positive capability, not just "a container exists".
          # PhotoPrism must serve an operational API AND report a non-empty
          # library -- the exact thing that was silently false for ~4 weeks.
          custom-command: |
            set -e
            status=$(docker exec photoprism curl -fsS --max-time 10 http://localhost:2342/api/v1/status)
            echo "photoprism /api/v1/status -> $status"
            echo "$status" | grep -q operational
            photos=$(docker exec photoprism sqlite3 /photoprism/storage/index.db \
              "select count(*) from photos where deleted_at is null;")
            echo "photoprism library photo count -> $photos"
            [ "$photos" -gt 0 ]
          # A deploy that leaves containers unhealthy must FAIL. Previously
          # this was false, so a run where all 7 containers failed their
          # health check still reported "success".
          fail-on-unhealthy: true

      # ======================================================================
      # DISCORD NOTIFICATION (Optional)
      # ======================================================================
      - name: 📣 Notify deployment
        if: always()
        uses: nuniesmith/actions/.github/actions/discord-notify@main
        continue-on-error: true
        with:
          webhook-url: ${{ secrets.DISCORD_WEBHOOK_ACTIONS }}
          title: "🏠 Freddy Deployment"
          description: "Personal services server deployment"
          status: ${{ steps.deploy.outcome == 'success' && 'success' || 'failure' }}
          include-repo-info: true
          fields: |
            [
              {"name": "Server", "value": "Freddy", "inline": true},
              {"name": "Branch", "value": "${{ github.ref_name }}", "inline": true},
              {"name": "Health", "value": "${{ steps.health-checks.outputs.healthy == 'true' && '✅ Healthy' || '⚠️ Check Required' }}", "inline": true}
            ]

  # ==========================================================================
  # PIPELINE SUMMARY
  # ==========================================================================
  summary:
    name: 📊 Summary
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [deploy]
    if: always()
    steps:
      - name: 📊 Generate summary
        run: |
          echo "## 🏠 Freddy Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Step | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|" >> $GITHUB_STEP_SUMMARY

          # Deploy status
          if [ "${{ needs.deploy.result }}" = "success" ]; then
            echo "| 🚀 Deploy | ✅ Success |" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ needs.deploy.result }}" = "skipped" ]; then
            echo "| 🚀 Deploy | ⏭️ Skipped |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| 🚀 Deploy | ❌ Failed |" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📋 Details" >> $GITHUB_STEP_SUMMARY
          echo "- **Server:** Freddy (Personal Services)" >> $GITHUB_STEP_SUMMARY
          echo "- **Domain:** ${{ env.DOMAIN }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Triggered by:** ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY

      - name: ❌ Fail on deployment error
        if: needs.deploy.result == 'failure'
        run: |
          echo "❌ Deployment failed"
          exit 1
