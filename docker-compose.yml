# Docker Compose for FREDDY - Personal & Authentication Services
# Lightweight server handling photos, cloud storage, home automation, and more.
#
# SIMPLIFIED NETWORKING: All services on a single network for easy DNS resolution.
# Nginx can resolve all container names without complex network isolation.
# =============================================================================
# YAML ANCHORS - Reusable configuration blocks
# =============================================================================
x-common-env: &common-env
    TZ: ${TZ:-America/Toronto}
    PUID: ${PUID:-1001}
    PGID: ${PGID:-1001}

x-logging: &default-logging
    driver: json-file
    options:
        max-size: "10m"
        max-file: "3"

x-healthcheck-defaults: &healthcheck-defaults
    interval: 30s
    timeout: 10s
    retries: 3

# Named volumes for data/cache/databases only
volumes:
    # Photo Management volumes
    photos_originals:
        driver: local
        driver_opts:
            type: none
            o: bind
            device: /mnt/1tb/photos
    photoprism_storage:
        driver: local
        driver_opts:
            type: none
            o: bind
            device: /mnt/1tb/photoprism/storage
    photoprism_postgres_data:
        driver: local
        driver_opts:
            type: none
            o: bind
            device: /mnt/1tb/photoprism/postgres
    # Cloud Storage volumes
    nextcloud_html:
        driver: local
        driver_opts:
            type: none
            o: bind
            device: /mnt/1tb/nextcloud/html
    nextcloud_config:
        driver: local
        driver_opts:
            type: none
            o: bind
            device: /mnt/1tb/nextcloud/config
    nextcloud_data:
        driver: local
        driver_opts:
            type: none
            o: bind
            device: /mnt/1tb/nextcloud/data
    nextcloud_postgres_data:
        driver: local
        driver_opts:
            type: none
            o: bind
            device: /mnt/1tb/nextcloud/postgres
    # System Services volumes
    homeassistant_config:
        driver: local
        driver_opts:
            type: none
            o: bind
            device: /mnt/1tb/homeassistant
    # Audiobookshelf
    audiobookshelf_data:
        driver: local
        driver_opts:
            type: none
            o: bind
            device: /mnt/1tb/audiobooks
    audiobookshelf_config:
        driver: local
        driver_opts:
            type: none
            o: bind
            device: /mnt/1tb/audiobookshelf/config
    audiobookshelf_metadata:
        driver: local
        driver_opts:
            type: none
            o: bind
            device: /mnt/1tb/audiobookshelf/metadata
    # Authentik volumes
    authentik_postgres_data:
        driver: local
        driver_opts:
            type: none
            o: bind
            device: /mnt/1tb/authentik/postgres
    authentik_redis_data:
        driver: local
        driver_opts:
            type: none
            o: bind
            device: /mnt/1tb/authentik/redis
    authentik_media:
        driver: local
        driver_opts:
            type: none
            o: bind
            device: /mnt/1tb/authentik/media
    authentik_templates:
        driver: local
        driver_opts:
            type: none
            o: bind
            device: /mnt/1tb/authentik/templates
    authentik_certs:
        driver: local
        driver_opts:
            type: none
            o: bind
            device: /mnt/1tb/authentik/certs
    # Uptime Kuma
    uptime_kuma_data:
        driver: local
        driver_opts:
            type: none
            o: bind
            device: /mnt/1tb/uptime-kuma
    # Shelfmark - audiobook/ebook organiser and request service
    # audiobookshelf_data is reused rather than re-bound: both services must see
    # the same /mnt/1tb/audiobooks tree, and two bind volumes to one path would
    # be two names for the same thing waiting to drift.
    shelfmark_ebooks:
        driver: local
        driver_opts:
            type: none
            o: bind
            device: /mnt/1tb/ebooks
    shelfmark_data:
        driver: local
        driver_opts:
            type: none
            o: bind
            device: /mnt/1tb/shelfmark/data
    shelfmark_incoming:
        driver: local
        driver_opts:
            type: none
            o: bind
            device: /mnt/1tb/shelfmark/incoming
    shelfmark_work:
        driver: local
        driver_opts:
            type: none
            o: bind
            device: /mnt/1tb/shelfmark/work
    shelfmark_quarantine:
        driver: local
        driver_opts:
            type: none
            o: bind
            device: /mnt/1tb/shelfmark/quarantine

# Single network for all services - simple and reliable DNS resolution
networks:
    freddy:
        driver: bridge

services:
    # =============================================================================
    # AUTHENTICATION - Authentik SSO
    # =============================================================================

    # authentik postgresql database
    authentik-postgres:
        image: postgres:16-alpine
        container_name: authentik-postgres
        environment:
            POSTGRES_DB: authentik
            POSTGRES_USER: ${AUTHENTIK_POSTGRES_USER:-authentik}
            POSTGRES_PASSWORD: ${AUTHENTIK_POSTGRES_PASSWORD}
            TZ: ${TZ:-America/Toronto}
        volumes:
            - authentik_postgres_data:/var/lib/postgresql/data
        restart: unless-stopped
        logging: *default-logging
        networks:
            - freddy
        healthcheck:
            test:
                [
                    "CMD",
                    "pg_isready",
                    "-U",
                    "${AUTHENTIK_POSTGRES_USER:-authentik}",
                    "-d",
                    "authentik",
                ]
            <<: *healthcheck-defaults
            start_period: 30s
        deploy:
            resources:
                limits:
                    memory: 512M

    # authentik redis cache
    authentik-redis:
        image: redis:alpine
        container_name: authentik-redis
        command: --save 60 1 --loglevel warning
        volumes:
            - authentik_redis_data:/data
        restart: unless-stopped
        logging: *default-logging
        networks:
            - freddy
        healthcheck:
            test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
            <<: *healthcheck-defaults
            start_period: 10s
        deploy:
            resources:
                limits:
                    memory: 256M

    # authentik server (web UI + API)
    authentik-server:
        image: ghcr.io/goauthentik/server:latest
        container_name: authentik-server
        command: server
        environment:
            AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY}
            AUTHENTIK_REDIS__HOST: authentik-redis
            AUTHENTIK_POSTGRESQL__HOST: authentik-postgres
            AUTHENTIK_POSTGRESQL__USER: ${AUTHENTIK_POSTGRES_USER:-authentik}
            AUTHENTIK_POSTGRESQL__NAME: authentik
            AUTHENTIK_POSTGRESQL__PASSWORD: ${AUTHENTIK_POSTGRES_PASSWORD}
            AUTHENTIK_EMAIL__HOST: ${EMAIL_HOST:-smtp.gmail.com}
            AUTHENTIK_EMAIL__PORT: ${EMAIL_PORT:-587}
            AUTHENTIK_EMAIL__USERNAME: ${EMAIL_USERNAME:-}
            AUTHENTIK_EMAIL__PASSWORD: ${EMAIL_PASSWORD:-}
            AUTHENTIK_EMAIL__USE_TLS: "true"
            AUTHENTIK_EMAIL__FROM: ${EMAIL_FROM:-}
            AUTHENTIK_ERROR_REPORTING__ENABLED: ${AUTHENTIK_ERROR_REPORTING__ENABLED:-false}
        volumes:
            - authentik_media:/media
            - authentik_templates:/templates
            - authentik_certs:/certs
        ports:
            - "9000:9000"
            - "9443:9443"
        restart: unless-stopped
        logging: *default-logging
        depends_on:
            authentik-postgres:
                condition: service_healthy
            authentik-redis:
                condition: service_healthy
        networks:
            - freddy
        healthcheck:
            test: ["CMD", "ak", "healthcheck"]
            <<: *healthcheck-defaults
            start_period: 60s
        deploy:
            resources:
                limits:
                    memory: 1G

    # authentik worker (background tasks, LDAP outposts, etc.)
    authentik-worker:
        image: ghcr.io/goauthentik/server:latest
        container_name: authentik-worker
        command: worker
        environment:
            AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY}
            AUTHENTIK_REDIS__HOST: authentik-redis
            AUTHENTIK_POSTGRESQL__HOST: authentik-postgres
            AUTHENTIK_POSTGRESQL__USER: ${AUTHENTIK_POSTGRES_USER:-authentik}
            AUTHENTIK_POSTGRESQL__NAME: authentik
            AUTHENTIK_POSTGRESQL__PASSWORD: ${AUTHENTIK_POSTGRES_PASSWORD}
            AUTHENTIK_EMAIL__HOST: ${EMAIL_HOST:-smtp.gmail.com}
            AUTHENTIK_EMAIL__PORT: ${EMAIL_PORT:-587}
            AUTHENTIK_EMAIL__USERNAME: ${EMAIL_USERNAME:-}
            AUTHENTIK_EMAIL__PASSWORD: ${EMAIL_PASSWORD:-}
            AUTHENTIK_EMAIL__USE_TLS: "true"
            AUTHENTIK_EMAIL__FROM: ${EMAIL_FROM:-}
        user: root
        volumes:
            - authentik_media:/media
            - authentik_templates:/templates
            - authentik_certs:/certs
            - /var/run/docker.sock:/var/run/docker.sock
        restart: unless-stopped
        logging: *default-logging
        depends_on:
            authentik-postgres:
                condition: service_healthy
            authentik-redis:
                condition: service_healthy
        networks:
            - freddy
        healthcheck:
            test: ["CMD", "ak", "healthcheck"]
            <<: *healthcheck-defaults
            start_period: 60s
        deploy:
            resources:
                limits:
                    memory: 1G

    # =============================================================================
    # MONITORING
    # =============================================================================

    # uptime kuma - service monitoring dashboard
    uptime-kuma:
        image: louislam/uptime-kuma:latest
        container_name: uptime-kuma
        environment:
            TZ: ${TZ:-America/Toronto}
        volumes:
            - uptime_kuma_data:/app/data
            - /var/run/docker.sock:/var/run/docker.sock:ro
        ports:
            - "3001:3001"
        restart: unless-stopped
        logging: *default-logging
        networks:
            - freddy
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    'node -e "const http = require(''http''); const options = { host: ''localhost'', port: 3001, path: ''/api/entry-page'', timeout: 2000 }; const req = http.request(options, (res) => { process.exit(res.statusCode === 200 ? 0 : 1) }); req.on(''error'', () => process.exit(1)); req.end();"',
                ]
            <<: *healthcheck-defaults
            start_period: 30s
        deploy:
            resources:
                limits:
                    memory: 256M

    # =============================================================================
    # PHOTO MANAGEMENT
    # =============================================================================

    # photoprism - dedicated photo management app
    photoprism:
        image: photoprism/photoprism:latest
        container_name: photoprism
        environment:
            PHOTOPRISM_ADMIN_PASSWORD: ${PHOTOPRISM_ADMIN_PASSWORD:-pleasechange}
            PHOTOPRISM_SITE_URL: http://localhost:2342/
            PHOTOPRISM_DATABASE_DRIVER: postgres
            PHOTOPRISM_DATABASE_SERVER: photoprism-postgres:5432
            PHOTOPRISM_DATABASE_NAME: ${PHOTOPRISM_DB_NAME:-photoprism}
            PHOTOPRISM_DATABASE_USER: ${PHOTOPRISM_DB_USER:-photoprism}
            PHOTOPRISM_DATABASE_PASSWORD: ${PHOTOPRISM_DB_PASSWORD}
            PHOTOPRISM_UID: ${PUID:-1001}
            PHOTOPRISM_GID: ${PGID:-1001}
            TZ: ${TZ:-America/Toronto}
        volumes:
            - photos_originals:/photoprism/originals
            - photoprism_storage:/photoprism/storage
        ports:
            - "2342:2342"
        restart: unless-stopped
        logging: *default-logging
        depends_on:
            photoprism-postgres:
                condition: service_healthy
        networks:
            - freddy
        healthcheck:
            test: ["CMD", "photoprism", "status"]
            <<: *healthcheck-defaults
            start_period: 60s
        deploy:
            resources:
                limits:
                    memory: 2G

    # postgres database for photoprism
    photoprism-postgres:
        image: postgres:16-alpine
        container_name: photoprism-postgres
        environment:
            POSTGRES_DB: ${PHOTOPRISM_DB_NAME:-photoprism}
            POSTGRES_USER: ${PHOTOPRISM_DB_USER:-photoprism}
            POSTGRES_PASSWORD: ${PHOTOPRISM_DB_PASSWORD}
            TZ: ${TZ:-America/Toronto}
        volumes:
            - photoprism_postgres_data:/var/lib/postgresql/data
        restart: unless-stopped
        logging: *default-logging
        networks:
            - freddy
        healthcheck:
            test:
                [
                    "CMD",
                    "pg_isready",
                    "-U",
                    "${PHOTOPRISM_DB_USER:-photoprism}",
                    "-d",
                    "${PHOTOPRISM_DB_NAME:-photoprism}",
                ]
            <<: *healthcheck-defaults
            start_period: 30s
        deploy:
            resources:
                limits:
                    memory: 512M

    # =============================================================================
    # CLOUD STORAGE
    # =============================================================================

    # nextcloud - file sharing with postgres db
    # Custom image based on official nextcloud:stable-apache
    # Runs Apache as www-data; entrypoint runs as root for init only
    nextcloud:
        build:
            context: .
            dockerfile: ./docker/nextcloud/Dockerfile
        container_name: nextcloud
        environment:
            TZ: ${TZ:-America/Toronto}
            POSTGRES_HOST: nextcloud-postgres
            POSTGRES_DB: ${NEXTCLOUD_DB_NAME:-nextcloud}
            POSTGRES_USER: ${NEXTCLOUD_DB_USER:-nextcloud}
            POSTGRES_PASSWORD: ${NEXTCLOUD_DB_PASSWORD}
            NEXTCLOUD_ADMIN_USER: ${NEXTCLOUD_ADMIN_USER:-admin}
            NEXTCLOUD_ADMIN_PASSWORD: ${NEXTCLOUD_ADMIN_PASSWORD}
            NEXTCLOUD_TRUSTED_DOMAINS: nc.7gram.xyz localhost nextcloud
            APACHE_DISABLE_REWRITE_IP: 1
            TRUSTED_PROXIES: 172.16.0.0/12 10.0.0.0/8 192.168.0.0/16
            OVERWRITEPROTOCOL: https
            OVERWRITEHOST: nc.7gram.xyz
            OVERWRITECLIURL: https://nc.7gram.xyz
        volumes:
            - nextcloud_html:/var/www/html
            - nextcloud_config:/var/www/html/config
            - nextcloud_data:/var/www/html/data
        ports:
            - "8080:80"
        restart: unless-stopped
        logging: *default-logging
        depends_on:
            nextcloud-postgres:
                condition: service_healthy
        networks:
            - freddy
        healthcheck:
            test:
                ["CMD-SHELL", "curl -sf http://localhost/status.php || exit 1"]
            <<: *healthcheck-defaults
            start_period: 120s
        deploy:
            resources:
                limits:
                    memory: 1G

    # nextcloud cron - runs background jobs every 5 minutes
    # Uses the same image and volumes as nextcloud but with the cron entrypoint
    nextcloud-cron:
        build:
            context: .
            dockerfile: ./docker/nextcloud/Dockerfile
        container_name: nextcloud-cron
        entrypoint: /cron.sh
        environment:
            TZ: ${TZ:-America/Toronto}
        volumes:
            - nextcloud_html:/var/www/html
            - nextcloud_config:/var/www/html/config
            - nextcloud_data:/var/www/html/data
        restart: unless-stopped
        logging: *default-logging
        depends_on:
            - nextcloud
        networks:
            - freddy
        deploy:
            resources:
                limits:
                    memory: 256M

    # postgres database for nextcloud
    nextcloud-postgres:
        image: postgres:16-alpine
        container_name: nextcloud-postgres
        environment:
            POSTGRES_DB: ${NEXTCLOUD_DB_NAME:-nextcloud}
            POSTGRES_USER: ${NEXTCLOUD_DB_USER:-nextcloud}
            POSTGRES_PASSWORD: ${NEXTCLOUD_DB_PASSWORD}
            TZ: ${TZ:-America/Toronto}
        volumes:
            - nextcloud_postgres_data:/var/lib/postgresql/data
        restart: unless-stopped
        logging: *default-logging
        networks:
            - freddy
        healthcheck:
            test:
                [
                    "CMD",
                    "pg_isready",
                    "-U",
                    "${NEXTCLOUD_DB_USER:-nextcloud}",
                    "-d",
                    "${NEXTCLOUD_DB_NAME:-nextcloud}",
                ]
            <<: *healthcheck-defaults
            start_period: 30s
        deploy:
            resources:
                limits:
                    memory: 512M

    # =============================================================================
    # SYSTEM SERVICES
    # =============================================================================

    # home assistant
    # NOTE: host network required for mDNS/SSDP device discovery
    # Mount only specific devices you need (e.g., /dev/ttyUSB0 for Zigbee)
    homeassistant:
        image: ghcr.io/home-assistant/home-assistant:stable
        container_name: homeassistant
        privileged: true
        network_mode: host
        environment:
            TZ: ${TZ:-America/Toronto}
        volumes:
            - homeassistant_config:/config
            - /etc/localtime:/etc/localtime:ro
            - /run/dbus:/run/dbus:ro
        restart: unless-stopped
        logging: *default-logging
        healthcheck:
            test: ["CMD", "curl", "-sf", "http://localhost:8123/manifest.json"]
            <<: *healthcheck-defaults
            start_period: 60s
        deploy:
            resources:
                limits:
                    memory: 1G

    # audiobookshelf
    audiobookshelf:
        image: ghcr.io/advplyr/audiobookshelf:latest
        container_name: audiobookshelf
        ports:
            - "13378:80"
        volumes:
            - audiobookshelf_data:/audiobooks
            - audiobookshelf_config:/config
            - audiobookshelf_metadata:/metadata
        environment:
            <<: *common-env
        networks:
            - freddy
        restart: unless-stopped
        logging: *default-logging
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "wget --spider --quiet http://localhost:80/healthcheck || exit 1",
                ]
            <<: *healthcheck-defaults
            start_period: 40s
        deploy:
            resources:
                limits:
                    memory: 512M

    # =============================================================================
    # SHELFMARK - audiobook/ebook organiser, request API, and Discord bot
    # =============================================================================
    # Image is published by nuniesmith/shelfmark CI; this host does not build it.
    # The API is bound to loopback on purpose — Princess terminates TLS for
    # shelfmark.7gram.xyz and reaches it over the private tunnel. Container-to-
    # container traffic uses the service name on the freddy network instead.
    #
    # The user is pinned to jordan:actions (1000:1001) rather than PUID/PGID.
    # The three trees it writes are owned differently — /mnt/1tb/audiobooks is
    # jordan:actions, /mnt/1tb/ebooks is actions:actions, /mnt/1tb/shelfmark is
    # jordan:actions — and all three are mode 2775, so that one uid/gid pair is
    # the only combination with write access to every one of them without a
    # chown. PUID/PGID here is 1000:1000, which cannot write /mnt/1tb/ebooks.

    shelfmark-api:
        image: ghcr.io/nuniesmith/shelfmark:latest
        container_name: shelfmark-api
        user: "${SHELFMARK_UID:-1000}:${SHELFMARK_GID:-1001}"
        command: ["shelfmark-api"]
        ports:
            - "127.0.0.1:8110:8000"
        volumes:
            - audiobookshelf_data:/audiobooks
            - shelfmark_ebooks:/ebooks
            - shelfmark_data:/data
            - shelfmark_incoming:/incoming
            - shelfmark_work:/work
            - shelfmark_quarantine:/quarantine
        environment:
            <<: *common-env
            SHELFMARK_DB_PATH: /data/shelfmark.db
            SHELFMARK_AUDIOBOOKS_ROOT: /audiobooks
            SHELFMARK_EBOOKS_ROOT: /ebooks
            SHELFMARK_INCOMING_ROOT: /incoming
            SHELFMARK_WORK_ROOT: /work
            SHELFMARK_QUARANTINE_ROOT: /quarantine
            SHELFMARK_API_TOKEN: ${SHELFMARK_API_TOKEN:-}
            AUDIOBOOKSHELF_URL: http://audiobookshelf:80
            AUDIOBOOKSHELF_API_TOKEN: ${AUDIOBOOKSHELF_API_TOKEN:-}
            AUDIOBOOKSHELF_LIBRARY_ID: ${AUDIOBOOKSHELF_LIBRARY_ID:-}
            PROWLARR_URL: ${PROWLARR_URL:-}
            PROWLARR_API_KEY: ${PROWLARR_API_KEY:-}
            QBITTORRENT_URL: ${QBITTORRENT_URL:-}
            QBITTORRENT_USERNAME: ${QBITTORRENT_USERNAME:-}
            QBITTORRENT_PASSWORD: ${QBITTORRENT_PASSWORD:-}
        networks:
            - freddy
        restart: unless-stopped
        logging: *default-logging
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "python -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/healthz',timeout=3)\" || exit 1",
                ]
            <<: *healthcheck-defaults
            start_period: 20s
        deploy:
            resources:
                limits:
                    memory: 512M

    shelfmark-worker:
        image: ghcr.io/nuniesmith/shelfmark:latest
        container_name: shelfmark-worker
        user: "${SHELFMARK_UID:-1000}:${SHELFMARK_GID:-1001}"
        command: ["shelfmark-worker"]
        volumes:
            - audiobookshelf_data:/audiobooks
            - shelfmark_ebooks:/ebooks
            - shelfmark_data:/data
            - shelfmark_incoming:/incoming
            - shelfmark_work:/work
            - shelfmark_quarantine:/quarantine
        environment:
            <<: *common-env
            SHELFMARK_DB_PATH: /data/shelfmark.db
            SHELFMARK_AUDIOBOOKS_ROOT: /audiobooks
            SHELFMARK_EBOOKS_ROOT: /ebooks
            SHELFMARK_INCOMING_ROOT: /incoming
            SHELFMARK_WORK_ROOT: /work
            SHELFMARK_QUARANTINE_ROOT: /quarantine
            SHELFMARK_WORKER_ID: freddy-shelfmark-worker
            AUDIOBOOKSHELF_URL: http://audiobookshelf:80
            AUDIOBOOKSHELF_API_TOKEN: ${AUDIOBOOKSHELF_API_TOKEN:-}
            AUDIOBOOKSHELF_LIBRARY_ID: ${AUDIOBOOKSHELF_LIBRARY_ID:-}
            PROWLARR_URL: ${PROWLARR_URL:-}
            PROWLARR_API_KEY: ${PROWLARR_API_KEY:-}
            QBITTORRENT_URL: ${QBITTORRENT_URL:-}
            QBITTORRENT_USERNAME: ${QBITTORRENT_USERNAME:-}
            QBITTORRENT_PASSWORD: ${QBITTORRENT_PASSWORD:-}
        networks:
            - freddy
        restart: unless-stopped
        logging: *default-logging
        deploy:
            resources:
                limits:
                    memory: 512M

    # Held behind a profile: the bot exits immediately without DISCORD_BOT_TOKEN,
    # and `restart: unless-stopped` would turn that into a crash loop. Start it
    # with `docker compose --profile discord up -d shelfmark-bot` once the token
    # and SHELFMARK_API_TOKEN are in .env.
    shelfmark-bot:
        image: ghcr.io/nuniesmith/shelfmark:latest
        container_name: shelfmark-bot
        command: ["shelfmark-bot"]
        profiles:
            - discord
        environment:
            <<: *common-env
            SHELFMARK_API_URL: http://shelfmark-api:8000
            SHELFMARK_API_TOKEN: ${SHELFMARK_API_TOKEN:-}
            DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:-}
            SHELFMARK_DISCORD_GUILD_ID: ${SHELFMARK_DISCORD_GUILD_ID:-}
            SHELFMARK_DISCORD_ALLOWED_ROLE_IDS: ${SHELFMARK_DISCORD_ALLOWED_ROLE_IDS:-}
        depends_on:
            shelfmark-api:
                condition: service_healthy
        networks:
            - freddy
        restart: unless-stopped
        logging: *default-logging
        deploy:
            resources:
                limits:
                    memory: 256M
