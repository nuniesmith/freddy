# Docker Compose for FREDDY - Personal & Authentication Services
# Lightweight server handling photos, cloud storage, home automation, and more.
#
# SIMPLIFIED NETWORKING: All services on a single network for easy DNS resolution.
# Nginx can resolve all container names without complex network isolation.
# =============================================================================
# YAML ANCHORS - Reusable configuration blocks
# =============================================================================
x-common-env: &common-env
    TZ: ${TZ:-America/Toronto}
    PUID: ${PUID:-1001}
    PGID: ${PGID:-1001}

x-logging: &default-logging
    driver: json-file
    options:
        max-size: "10m"
        max-file: "3"

x-healthcheck-defaults: &healthcheck-defaults
    interval: 30s
    timeout: 10s
    retries: 3

# Named volumes for data/cache/databases only
volumes:
    # Photo Management volumes
    photos_originals:
        driver: local
        driver_opts:
            type: none
            o: bind
            device: /mnt/1tb/photos
    photoprism_storage:
        driver: local
        driver_opts:
            type: none
            o: bind
            device: /mnt/1tb/photoprism/storage
    # photoprism_postgres_data intentionally removed: PhotoPrism has no
    # PostgreSQL driver, so nothing can ever populate it. The directory
    # /mnt/1tb/photoprism/postgres is left in place on disk.
    # Cloud Storage volumes
    nextcloud_html:
        driver: local
        driver_opts:
            type: none
            o: bind
            device: /mnt/1tb/nextcloud/html
    nextcloud_config:
        driver: local
        driver_opts:
            type: none
            o: bind
            device: /mnt/1tb/nextcloud/config
    nextcloud_data:
        driver: local
        driver_opts:
            type: none
            o: bind
            device: /mnt/1tb/nextcloud/data
    nextcloud_postgres_data:
        driver: local
        driver_opts:
            type: none
            o: bind
            device: /mnt/1tb/nextcloud/postgres
    # System Services volumes
    homeassistant_config:
        driver: local
        driver_opts:
            type: none
            o: bind
            device: /mnt/1tb/homeassistant
    # Audiobookshelf
    audiobookshelf_data:
        driver: local
        driver_opts:
            type: none
            o: bind
            device: /mnt/1tb/audiobooks
    audiobookshelf_config:
        driver: local
        driver_opts:
            type: none
            o: bind
            device: /mnt/1tb/audiobookshelf/config
    audiobookshelf_metadata:
        driver: local
        driver_opts:
            type: none
            o: bind
            device: /mnt/1tb/audiobookshelf/metadata
    # Authentik volumes
    # Uptime Kuma
    uptime_kuma_data:
        driver: local
        driver_opts:
            type: none
            o: bind
            device: /mnt/1tb/uptime-kuma
    # Shelfmark - audiobook/ebook organiser and request service
    # audiobookshelf_data is reused rather than re-bound: both services must see
    # the same /mnt/1tb/audiobooks tree, and two bind volumes to one path would
    # be two names for the same thing waiting to drift.
    shelfmark_ebooks:
        driver: local
        driver_opts:
            type: none
            o: bind
            device: /mnt/1tb/ebooks
    shelfmark_data:
        driver: local
        driver_opts:
            type: none
            o: bind
            device: /mnt/1tb/shelfmark/data
    shelfmark_incoming:
        driver: local
        driver_opts:
            type: none
            o: bind
            device: /mnt/1tb/shelfmark/incoming
    shelfmark_work:
        driver: local
        driver_opts:
            type: none
            o: bind
            device: /mnt/1tb/shelfmark/work
    shelfmark_quarantine:
        driver: local
        driver_opts:
            type: none
            o: bind
            device: /mnt/1tb/shelfmark/quarantine
    # Private key for the restricted shelfmark-sync account on sullivan. Written
    # by CI as the actions user so it lands mode 600 owned by uid 1001, which is
    # what the containers run as — ssh refuses a group-readable private key, so
    # this cannot be created by hand as another user.
    shelfmark_ssh:
        driver: local
        driver_opts:
            type: none
            o: bind
            device: /mnt/1tb/shelfmark/ssh

# Single network for all services - simple and reliable DNS resolution
networks:
    freddy:
        driver: bridge

services:
    # =============================================================================
    # AUTHENTICATION - Authentik SSO
    # =============================================================================

    # =============================================================================
    # MONITORING
    # =============================================================================

    # uptime kuma - service monitoring dashboard
    uptime-kuma:
        # The 1.x line, not `latest`: 2.x migrates the database one way, and the
        # uptime-kuma-api client that provision_kuma.py (sullivan repo) uses to
        # manage the monitors speaks 1.x only. Move to 2 deliberately, not on
        # some morning's daily update.
        image: louislam/uptime-kuma:1
        container_name: uptime-kuma
        environment:
            TZ: ${TZ:-America/Toronto}
        volumes:
            - uptime_kuma_data:/app/data
            - /var/run/docker.sock:/var/run/docker.sock:ro
        ports:
            - "3001:3001"
        restart: unless-stopped
        logging: *default-logging
        networks:
            - freddy
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    'node -e "const http = require(''http''); const options = { host: ''localhost'', port: 3001, path: ''/api/entry-page'', timeout: 2000 }; const req = http.request(options, (res) => { process.exit(res.statusCode === 200 ? 0 : 1) }); req.on(''error'', () => process.exit(1)); req.end();"',
                ]
            <<: *healthcheck-defaults
            start_period: 30s
        deploy:
            resources:
                limits:
                    memory: 256M

    # =============================================================================
    # PHOTO MANAGEMENT
    # =============================================================================

    # photoprism - dedicated photo management app
    photoprism:
        image: photoprism/photoprism:latest
        container_name: photoprism
        environment:
            PHOTOPRISM_ADMIN_PASSWORD: ${PHOTOPRISM_ADMIN_PASSWORD:-pleasechange}
            PHOTOPRISM_SITE_URL: http://localhost:2342/
            # PhotoPrism supports SQLite and MariaDB/MySQL ONLY. It has no
            # PostgreSQL driver: with DRIVER=postgres it logs
            #   "config: support for PostgreSQL is not yet available in this version"
            # and then loops forever on "waiting for the database to become
            # available". It never starts its web server. See PR for details.
            # SQLite keeps the existing /photoprism/storage/index.db index.
            PHOTOPRISM_DATABASE_DRIVER: sqlite
            PHOTOPRISM_UID: ${PUID:-1001}
            PHOTOPRISM_GID: ${PGID:-1001}
            TZ: ${TZ:-America/Toronto}
        volumes:
            - photos_originals:/photoprism/originals
            - photoprism_storage:/photoprism/storage
        ports:
            - "2342:2342"
        restart: unless-stopped
        logging: *default-logging
        networks:
            - freddy
        healthcheck:
            # Do NOT use `photoprism status`: it prints "cannot connect to
            # 0.0.0.0:2342" and still exits 0, so Docker reported this
            # container "healthy" for ~4 weeks while it served nothing.
            # Assert the positive capability instead -- the API only answers
            # once the database is open and the web server is actually up.
            test:
                [
                    "CMD-SHELL",
                    "curl -fsS --max-time 5 http://localhost:2342/api/v1/status | grep -q operational",
                ]
            <<: *healthcheck-defaults
            start_period: 60s
        deploy:
            resources:
                limits:
                    memory: 2G

    # NOTE: there is deliberately no `photoprism-postgres` service here.
    # PhotoPrism cannot talk to PostgreSQL (see the comment on the photoprism
    # service above), so a Postgres sidecar for it can only ever sit empty and
    # mislead. If PhotoPrism ever ships a real PostgreSQL driver, add it back
    # then. Its old data directory (/mnt/1tb/photoprism/postgres) and the
    # docker volume freddy_photoprism_postgres_data are left on disk
    # untouched; they contain no tables.

    # =============================================================================
    # CLOUD STORAGE
    # =============================================================================

    # nextcloud - file sharing with postgres db
    # Custom image based on official nextcloud:stable-apache
    # Runs Apache as www-data; entrypoint runs as root for init only
    nextcloud:
        build:
            context: .
            dockerfile: ./docker/nextcloud/Dockerfile
        container_name: nextcloud
        environment:
            TZ: ${TZ:-America/Toronto}
            POSTGRES_HOST: nextcloud-postgres
            POSTGRES_DB: ${NEXTCLOUD_DB_NAME:-nextcloud}
            POSTGRES_USER: ${NEXTCLOUD_DB_USER:-nextcloud}
            POSTGRES_PASSWORD: ${NEXTCLOUD_DB_PASSWORD}
            NEXTCLOUD_ADMIN_USER: ${NEXTCLOUD_ADMIN_USER:-admin}
            NEXTCLOUD_ADMIN_PASSWORD: ${NEXTCLOUD_ADMIN_PASSWORD}
            NEXTCLOUD_TRUSTED_DOMAINS: nc.7gram.xyz localhost nextcloud
            APACHE_DISABLE_REWRITE_IP: 1
            TRUSTED_PROXIES: 172.16.0.0/12 10.0.0.0/8 192.168.0.0/16
            OVERWRITEPROTOCOL: https
            OVERWRITEHOST: nc.7gram.xyz
            OVERWRITECLIURL: https://nc.7gram.xyz
        volumes:
            - nextcloud_html:/var/www/html
            - nextcloud_config:/var/www/html/config
            - nextcloud_data:/var/www/html/data
        ports:
            - "8080:80"
        restart: unless-stopped
        logging: *default-logging
        depends_on:
            nextcloud-postgres:
                condition: service_healthy
        networks:
            - freddy
        healthcheck:
            test:
                ["CMD-SHELL", "curl -sf http://localhost/status.php || exit 1"]
            <<: *healthcheck-defaults
            start_period: 120s
        deploy:
            resources:
                limits:
                    memory: 1G

    # nextcloud cron - runs background jobs every 5 minutes
    # Uses the same image and volumes as nextcloud but with the cron entrypoint
    nextcloud-cron:
        build:
            context: .
            dockerfile: ./docker/nextcloud/Dockerfile
        container_name: nextcloud-cron
        entrypoint: /cron.sh
        environment:
            TZ: ${TZ:-America/Toronto}
        volumes:
            - nextcloud_html:/var/www/html
            - nextcloud_config:/var/www/html/config
            - nextcloud_data:/var/www/html/data
        restart: unless-stopped
        logging: *default-logging
        depends_on:
            - nextcloud
        networks:
            - freddy
        deploy:
            resources:
                limits:
                    memory: 256M

    # postgres database for nextcloud
    nextcloud-postgres:
        image: postgres:16-alpine
        container_name: nextcloud-postgres
        environment:
            POSTGRES_DB: ${NEXTCLOUD_DB_NAME:-nextcloud}
            POSTGRES_USER: ${NEXTCLOUD_DB_USER:-nextcloud}
            POSTGRES_PASSWORD: ${NEXTCLOUD_DB_PASSWORD}
            TZ: ${TZ:-America/Toronto}
        volumes:
            - nextcloud_postgres_data:/var/lib/postgresql/data
        restart: unless-stopped
        logging: *default-logging
        networks:
            - freddy
        healthcheck:
            test:
                [
                    "CMD",
                    "pg_isready",
                    "-U",
                    "${NEXTCLOUD_DB_USER:-nextcloud}",
                    "-d",
                    "${NEXTCLOUD_DB_NAME:-nextcloud}",
                ]
            <<: *healthcheck-defaults
            start_period: 30s
        deploy:
            resources:
                limits:
                    memory: 512M

    # =============================================================================
    # SYSTEM SERVICES
    # =============================================================================

    # home assistant
    # NOTE: host network required for mDNS/SSDP device discovery
    # Mount only specific devices you need (e.g., /dev/ttyUSB0 for Zigbee)
    homeassistant:
        image: ghcr.io/home-assistant/home-assistant:stable
        container_name: homeassistant
        privileged: true
        network_mode: host
        environment:
            TZ: ${TZ:-America/Toronto}
        volumes:
            - homeassistant_config:/config
            - /etc/localtime:/etc/localtime:ro
            - /run/dbus:/run/dbus:ro
        restart: unless-stopped
        logging: *default-logging
        healthcheck:
            test: ["CMD", "curl", "-sf", "http://localhost:8123/manifest.json"]
            <<: *healthcheck-defaults
            start_period: 60s
        deploy:
            resources:
                limits:
                    memory: 1G

    # audiobookshelf
    audiobookshelf:
        image: ghcr.io/advplyr/audiobookshelf:latest
        container_name: audiobookshelf
        ports:
            - "13378:80"
        volumes:
            - audiobookshelf_data:/audiobooks
            - audiobookshelf_config:/config
            - audiobookshelf_metadata:/metadata
        environment:
            <<: *common-env
        networks:
            - freddy
        restart: unless-stopped
        logging: *default-logging
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "wget --spider --quiet http://localhost:80/healthcheck || exit 1",
                ]
            <<: *healthcheck-defaults
            start_period: 40s
        deploy:
            resources:
                limits:
                    memory: 512M

    # =============================================================================
    # SHELFMARK - audiobook/ebook organiser, request API, and Discord bot
    # =============================================================================
    # Image is published by nuniesmith/shelfmark CI; this host does not build it.
    #
    # Port 8110 is published on all interfaces, matching audiobookshelf (13378)
    # and the other services here. Princess reaches this host over Tailscale at
    # 100.106.65.55, so a loopback-only bind would make shelfmark.7gram.xyz
    # unroutable. 8080 is already Nextcloud's, which is why not that.
    #
    # Upstreams. Prowlarr and qBittorrent use their public 7gram names: Sullivan
    # is a different Docker host, and Tailscale MagicDNS does NOT resolve inside
    # a container (http://sullivan:9696 times out from here, measured), so a name
    # that works means a Princess-published one.
    #
    # Audiobookshelf is the exception and deliberately uses the container name.
    # It runs in this very Compose project, and abs.7gram.xyz would leave the
    # machine, cross the internet to Princess in Toronto, and come back over
    # Tailscale to reach a container on the same bridge. Measured from a
    # container here: 0.0014s by container name, 0.138s via the public name —
    # 100x, to talk to a neighbour. It also makes an internal call depend on
    # Linode being up. Override AUDIOBOOKSHELF_URL if that is ever wanted.
    #
    # The user is actions:actions (1001:1001), not PUID/PGID, and not jordan.
    # Deployment creates /mnt/1tb/shelfmark/data itself as actions:actions mode
    # 755, so only uid 1001 can write it — an earlier attempt to run as
    # jordan:actions crash-looped both containers on "unable to open database
    # file". 1001 also reaches the other trees: it owns /mnt/1tb/ebooks, and
    # /mnt/1tb/audiobooks is jordan:actions mode 2775 so the actions group
    # carries write there. Verified against all four mounts:
    #
    #     as 1001:1001   /data OK   /incoming OK   /ebooks OK   /audiobooks OK
    #     as 1000:1001   /data DENIED
    #
    # PUID/PGID on this host is 1000:1000, which reaches neither /data nor
    # /mnt/1tb/ebooks, which is why these are separate variables.

    shelfmark-api:
        image: ghcr.io/nuniesmith/shelfmark:latest
        container_name: shelfmark-api
        user: "${SHELFMARK_UID:-1001}:${SHELFMARK_GID:-1001}"
        command: ["shelfmark-api"]
        ports:
            - "8110:8000"
        volumes:
            - audiobookshelf_data:/audiobooks
            - shelfmark_ebooks:/ebooks
            - shelfmark_data:/data
            - shelfmark_incoming:/incoming
            - shelfmark_work:/work
            - shelfmark_quarantine:/quarantine
            - shelfmark_ssh:/run/secrets:ro
        environment:
            <<: *common-env
            SHELFMARK_DB_PATH: /data/shelfmark.db
            SHELFMARK_AUDIOBOOKS_ROOT: /audiobooks
            SHELFMARK_EBOOKS_ROOT: /ebooks
            SHELFMARK_INCOMING_ROOT: /incoming
            SHELFMARK_WORK_ROOT: /work
            SHELFMARK_QUARANTINE_ROOT: /quarantine
            SULLIVAN_SSH_HOST: ${SULLIVAN_SSH_HOST:-100.87.125.19}
            SULLIVAN_SSH_USER: ${SULLIVAN_SSH_USER:-shelfmark-sync}
            SULLIVAN_SSH_IDENTITY_FILE: /run/secrets/id_ed25519
            SULLIVAN_COMPLETED_ROOT: ${SULLIVAN_COMPLETED_ROOT:-/}
            SHELFMARK_API_TOKEN: ${SHELFMARK_API_TOKEN:-}
            # An ebook over Discord's 10 MB attachment limit gets a download
            # link on this address instead (shelfmark#39); princess already
            # forwards all of shelfmark.7gram.xyz to this API. *.7gram.xyz only
            # opens on the tailnet, hence the note posted with every link.
            SHELFMARK_PUBLIC_URL: ${SHELFMARK_PUBLIC_URL:-https://shelfmark.7gram.xyz}
            SHELFMARK_DOWNLOAD_LINK_NOTE: ${SHELFMARK_DOWNLOAD_LINK_NOTE:-It opens only with Tailscale switched on.}
            AUDIOBOOKSHELF_URL: ${AUDIOBOOKSHELF_URL:-http://audiobookshelf:80}
            AUDIOBOOKSHELF_API_TOKEN: ${AUDIOBOOKSHELF_API_TOKEN:-}
            AUDIOBOOKSHELF_LIBRARY_ID: ${AUDIOBOOKSHELF_LIBRARY_ID:-}
            PROWLARR_URL: ${PROWLARR_URL:-https://prowlarr.7gram.xyz}
            PROWLARR_API_KEY: ${PROWLARR_API_KEY:-}
            QBITTORRENT_URL: ${QBITTORRENT_URL:-https://qbt.7gram.xyz}
            QBITTORRENT_USERNAME: ${QBITTORRENT_USERNAME:-}
            QBITTORRENT_PASSWORD: ${QBITTORRENT_PASSWORD:-}
        networks:
            - freddy
        restart: unless-stopped
        logging: *default-logging
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "python -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/healthz',timeout=3)\" || exit 1",
                ]
            <<: *healthcheck-defaults
            start_period: 20s
        deploy:
            resources:
                limits:
                    memory: 512M

    shelfmark-worker:
        image: ghcr.io/nuniesmith/shelfmark:latest
        container_name: shelfmark-worker
        user: "${SHELFMARK_UID:-1001}:${SHELFMARK_GID:-1001}"
        command: ["shelfmark-worker"]
        volumes:
            - audiobookshelf_data:/audiobooks
            - shelfmark_ebooks:/ebooks
            - shelfmark_data:/data
            - shelfmark_incoming:/incoming
            - shelfmark_work:/work
            - shelfmark_quarantine:/quarantine
            - shelfmark_ssh:/run/secrets:ro
        environment:
            <<: *common-env
            SHELFMARK_DB_PATH: /data/shelfmark.db
            SHELFMARK_AUDIOBOOKS_ROOT: /audiobooks
            SHELFMARK_EBOOKS_ROOT: /ebooks
            SHELFMARK_INCOMING_ROOT: /incoming
            SHELFMARK_WORK_ROOT: /work
            SHELFMARK_QUARANTINE_ROOT: /quarantine
            SULLIVAN_SSH_HOST: ${SULLIVAN_SSH_HOST:-100.87.125.19}
            SULLIVAN_SSH_USER: ${SULLIVAN_SSH_USER:-shelfmark-sync}
            SULLIVAN_SSH_IDENTITY_FILE: /run/secrets/id_ed25519
            SULLIVAN_COMPLETED_ROOT: ${SULLIVAN_COMPLETED_ROOT:-/}
            SHELFMARK_WORKER_ID: freddy-shelfmark-worker
            # Where the worker announces a finished book and pages on a failed
            # chain. Empty is safe: the notifier is best-effort and a missing
            # URL simply means no notification, never a failed job.
            SHELFMARK_DISCORD_WEBHOOK_URL: ${SHELFMARK_DISCORD_WEBHOOK_URL:-}
            AUDIOBOOKSHELF_URL: ${AUDIOBOOKSHELF_URL:-http://audiobookshelf:80}
            AUDIOBOOKSHELF_API_TOKEN: ${AUDIOBOOKSHELF_API_TOKEN:-}
            AUDIOBOOKSHELF_LIBRARY_ID: ${AUDIOBOOKSHELF_LIBRARY_ID:-}
            PROWLARR_URL: ${PROWLARR_URL:-https://prowlarr.7gram.xyz}
            PROWLARR_API_KEY: ${PROWLARR_API_KEY:-}
            QBITTORRENT_URL: ${QBITTORRENT_URL:-https://qbt.7gram.xyz}
            QBITTORRENT_USERNAME: ${QBITTORRENT_USERNAME:-}
            QBITTORRENT_PASSWORD: ${QBITTORRENT_PASSWORD:-}
        networks:
            - freddy
        restart: unless-stopped
        logging: *default-logging
        # The worker serves no HTTP, so this is not a curl probe (the image has
        # no curl anyway). `shelfmark-worker-healthcheck` reads the same
        # liveness classifier /readyz uses, so `docker ps` and the API can no
        # longer disagree about whether the worker is alive.
        #
        # Without this the worker had NO healthcheck at all: it could die or
        # wedge while `docker ps` showed it merely "Up", jobs queued silently,
        # and nothing surfaced it. That is the whole failure this closes.
        #
        # start_period covers the first loop iteration writing its liveness row.
        # The classifier reports a never-seen worker as "unknown" and exits 0
        # rather than failing, so this is belt and braces, not load-bearing.
        healthcheck:
            test: ["CMD", "shelfmark-worker-healthcheck"]
            <<: *healthcheck-defaults
            start_period: 30s
        deploy:
            resources:
                limits:
                    memory: 512M

    # Held behind a profile: the bot exits immediately without DISCORD_BOT_TOKEN,
    # and `restart: unless-stopped` would turn that into a crash loop. Start it
    # with `docker compose --profile discord up -d shelfmark-bot` once the token
    # and SHELFMARK_API_TOKEN are in .env.
    shelfmark-bot:
        image: ghcr.io/nuniesmith/shelfmark:latest
        container_name: shelfmark-bot
        command: ["shelfmark-bot"]
        profiles:
            - discord
        environment:
            <<: *common-env
            SHELFMARK_API_URL: http://shelfmark-api:8000
            SHELFMARK_API_TOKEN: ${SHELFMARK_API_TOKEN:-}
            DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:-}
            SHELFMARK_DISCORD_GUILD_ID: ${SHELFMARK_DISCORD_GUILD_ID:-}
            SHELFMARK_DISCORD_ALLOWED_ROLE_IDS: ${SHELFMARK_DISCORD_ALLOWED_ROLE_IDS:-}
        depends_on:
            shelfmark-api:
                condition: service_healthy
        networks:
            - freddy
        restart: unless-stopped
        logging: *default-logging
        deploy:
            resources:
                limits:
                    memory: 256M
